        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
            } else {
                fallbackCopyText(text);
            }
        }
        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Fallback copy failed', err);
            }
            document.body.removeChild(textArea);
        }

                /* ==== src/format.ts =============================================== */
                const SUF = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td'];
                function fmt(n) {
                    if (!isFinite(n)) return '\u221e';
                    if (n < 0) return '-' + fmt(-n);
                    if (n < 1000) {
                        if (n < 10 && Math.floor(n) !== n) return n.toFixed(1);
                        return String(Math.floor(n));
                    }
                    let i = 0, v = n;
                    while (v >= 1000 && i < SUF.length - 1) { v /= 1000; i++; }
                    const s = v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.floor(v));
                    return s + SUF[i];
                }
                function comma(n) {
                    return Math.floor(Math.max(0, n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

                    const m = Math.floor((s % 3600) / 60);

                    if (h > 0) {

                /* ==== src/save.ts ================================================= */
                const KEY = 'stone_tycoon_save_v2';
                function fresh() {
                    return {
                        uid: generateLocalUid(),
                        coins: 0, gems: 0, cash: 0, level: 1,

                function applyDataToState(p) {
                    const base = fresh();
                    if (!p) return base;
                    const s = { ...base, ...p };
                    s.uid = p.uid || base.uid;
                    s.minerLevel = MINERS.map((_, i) => (Array.isArray(p.minerLevel) ? Number(p.minerLevel[i]) || 0 : base.minerLevel[i]));
                    s.unlocked = MINERS.map((_, i) => (Array.isArray(p.unlocked) ? !!p.unlocked[i] : base.unlocked[i]));
                    s.adProgress = MINERS.map((_, i) => (Array.isArray(p.adProgress) ? Number(p.adProgress[i]) || 0 : 0));
                    s.unlocked[0] = true;
                    if (s.minerLevel[0] < 1) s.minerLevel[0] = 1;
                    s.withdrawals = Array.isArray(p.withdrawals) ? p.withdrawals.slice(0, 30) : [];
                    s.account = typeof p.account === 'object' && p.account ? p.account : {};
                    s.level = Math.max(1, Math.floor(s.level));
                    s.maxHp = rockMaxHp(s.level);
                    if (!isFinite(s.hp) || s.hp <= 0 || s.hp > s.maxHp) s.hp = s.maxHp;
                    s.coins = Math.max(0, s.coins || 0);
                    s.gems = Math.max(0, s.gems || 0);
                    s.cash = Math.max(0, s.cash || 0);
                    s.runStartTime = p.runStartTime || Date.now();
                    s.adCooldownUntil = p.adCooldownUntil || 0;
                    s.minerResetTime = p.minerResetTime || Date.now();
                    s.rewardAdProgress = Array.isArray(p.rewardAdProgress) ? p.rewardAdProgress : [0, 0, 0, 0];
                    s.rewardCooldownUntil = p.rewardCooldownUntil || 0;
                    s.withdrawAdCount = Number(p.withdrawAdCount) || 0;
                    s.withdrawAdCooldownUntil = p.withdrawAdCooldownUntil || 0;

                    s.referralCoinsEarned = Number(p.referralCoinsEarned) || 0;
                    s.referralGemsEarned = Number(p.referralGemsEarned) || 0;
                    s.claimedReferrals = Number(p.claimedReferrals) || 0;
                    return s;
                }

                function load() {
                    const base = fresh();
                    try {
                        const raw = localStorage.getItem(KEY);
                        if (!raw) return base;
                        const p = JSON.parse(raw);
                        return applyDataToState(p);
                    } catch { return base; }
                }

                const S = load();

                function save() {
                    S.lastSeen = Date.now();
                    try { 
                        localStorage.setItem(KEY, JSON.stringify(S)); 
                    } catch {}

                    if (currentUser && db) {
                        db.collection('users').doc(currentUser.uid).set(S, { merge: true })
                            .catch(err => console.error("Firebase Firestore Save Error:", err));
                    }
                }

                // Process Incoming Referral Link
                function checkReferralCode() {
                    let refCode = null;
                    try {
                        const urlParams = new URLSearchParams(window.location.search);
                        refCode = urlParams.get('ref') || urlParams.get('startapp') || urlParams.get('start');
                        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.start_param) {
                            refCode = window.Telegram.WebApp.initDataUnsafe.start_param;
                        }
                    } catch (e) {}

                    if (refCode && refCode.startsWith('REF_')) {
                        const referrerUid = refCode.replace('REF_', '').trim();
                        if (referrerUid && referrerUid !== S.uid && !S.referredBy) {
                            S.referredBy = referrerUid;
                            save();
                            if (db) {
                                db.collection('referrals').add({
                                    referrer: referrerUid,
                                    referred: S.uid,
                                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                                    claimed: false
                                }).catch(err => console.error("Referral Record Error:", err));
                            }
                        }
                    }
                }

                // Authenticate & Sync with Firebase
                auth.signInAnonymously().catch(err => console.error("Firebase Auth Error:", err));
                auth.onAuthStateChanged(user => {
                    if (user) {
                        currentUser = user;
                        S.uid = user.uid;
                        db.collection('users').doc(user.uid).get().then(doc => {
                            if (doc.exists) {
                                const cloudData = doc.data();
                                const merged = applyDataToState(cloudData);
                                Object.assign(S, merged);
                                S.uid = user.uid;
                                try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
                            } else {
                                save();
                            }
                            checkReferralCode();
                        }).catch(err => {
                            console.error("Firestore Load Error:", err);
                            checkReferralCode();
                        });

                        // Dynamic Real-time Admin Config Listener
                        db.collection('admin').doc('config').onSnapshot(doc => {
                            if (doc.exists) {
                                applyAdminConfig(doc.data());
                            }
                        }, err => console.log("Admin config listener:", err));
                    } else {
                        checkReferralCode();
                    }
                });

                /* ==== src/audio.ts ================================================ */
                const pool = {};
                let ready = false, muted = false;
                function initAudio() {
                    if (ready || typeof Howl === 'undefined') return;
                    ready = true;
                    Object.keys(CUSTOM_SOUNDS).forEach((k) => {
                        pool[k] = new Howl({ 
                            src: [CUSTOM_SOUNDS[k]], 
                            volume: 0.6, 
                            preload: true, 
                            html5: false 
                        });
                    });
                    if (typeof Howler !== 'undefined') {
                        Howler.volume(0.9);
                        Howler.mute(muted);
                    }
                }
                function sfx(key, rate = 1, volScale = 1) {
                    if (!ready || muted) return;
                    const h = pool[key];
                    if (!h) return;

                function darken(c, f) {
                    const r = Math.max(0, Math.floor(((c >> 16) & 255) * (1 - f)));
                    const g = Math.max(0, Math.floor(((c >> 8) & 255) * (1 - f)));
                    const b = Math.max(0, Math.floor((c & 255) * (1 - f)));
                    return (r << 16) | (g << 8) | b;
                }
                function lighten(c, f) {
                    const r = Math.min(255, Math.floor(((c >> 16) & 255) + 255 * f));
                    const g = Math.min(255, Math.floor(((c >> 8) & 255) + 255 * f));
                    const b = Math.min(255, Math.floor((c & 255) + 255 * f));
                    return (r << 16) | (g << 8) | b;
                }

                    tick(dt) {
                        this.shown += (this.ratio - this.shown) * Math.min(1, dt * 0.014);
                        if (Math.abs(this.ratio - this.shown) < 0.0015) this.shown = this.ratio;
                        this.draw();

                    const shape = scene.make.graphics({});
                    shape.fillStyle(0xffffff); shape.fillRoundedRect(vx, vy, vw, vh, 16);
                    container.setMask(shape.createGeometryMask());
                    const top = container.y, min = top - Math.max(0, contentH - vh);
                    let dragging = false, last = 0, vel = 0;
                    const blocked = () => scene.data.get('modal') === true;
                    const inside = (p) => p.x >= vx && p.x <= vx + vw && p.y >= vy && p.y <= vy + vh;
                    scene.input.on('pointerdown', (p) => {
                        if (blocked() || !inside(p)) return;
                        dragging = true; last = p.y; vel = 0;
                    });
                    scene.input.on('pointerup', () => dragging = false);
                    scene.input.on('pointerupoutside', () => dragging = false);
                    scene.input.on('pointermove', (p) => {
                        if (!dragging || !p.isDown || blocked()) return;
                        const dy = p.y - last; last = p.y; vel = dy;
                        container.y = Phaser.Math.Clamp(container.y + dy, min, top);

                    playAd(reason, cb, blockId = null) {
                        const now = Date.now();
                        if (S.adCooldownUntil && now < S.adCooldownUntil) {
                            const left = Math.ceil((S.adCooldownUntil - now) / 1000);
                            toast(this, `Please wait ${left}s before watching another ad!`, C.gold);
                            return;
                        }

                        const onAdComplete = (ok) => {
                            if (ok) {
                                S.adsWatched = (S.adsWatched || 0) + 1;
                                S.adCooldownUntil = Date.now() + 5000;
                                save();
                            }
                            cb(ok);
                        };

                        const targetBlockId = blockId || adminConfig().adsgramMiners || ADSGRAM_BLOCK_ID_MINERS;

                        if (window.Adsgram) {
                            try {
                                const AdController = window.Adsgram.init({ blockId: targetBlockId });
                                AdController.show().then((result) => {
                                    onAdComplete(true);
                                }).catch((err) => {
                                    console.log("Adsgram notice / fallback to simulation:", err);
                                    this.playAdSimulated(reason, onAdComplete);
                                });
                                return;
                            } catch(e) {
                                console.warn("Adsgram exception:", e);
                            }
                        }

                        this.playAdSimulated(reason, onAdComplete);
                    }

                    playAdSimulated(reason, cb) {
                        if (this.scene.isActive('AdScene')) return;
                        this.input.enabled = false;
                        this.scene.launch('AdScene', {
                            reason,
                            done: (ok) => {
                                this.input.enabled = true;
                                cb(ok);
                            },
                        });
                        this.scene.bringToTop('AdScene');
                    }

                    close() {
                        if (this.closing) return;

                        this.tweens.add({
                            targets: [this.sheet, this.head], y: DH, duration: 260, ease: 'Cubic.easeIn',
                            onComplete: () => { this.game.events.emit('panel-closed'); this.scene.stop(); },
                        });
                    }

                        }
                    }
                    create() {
                        this.makeTextures();

                    update(_time, delta) {
                        const target = this.filesDone && this.fontsDone ? 1 : this.pct * 0.94;
                        this.shown += (target - this.shown) * Math.min(1, delta * 0.008);
                        const W = this.scale.width, H = this.scale.height;
                        const w = Math.min(W * 0.66, 420), x = (W - w) / 2, y = H * 0.55;

                        this.barG.clear();

                            rr(this.barG, x + 3, y + 3, fw, 12, 6, C.gold, 1);

                    buildProceduralTextures() {
                        const createTex = (key, w, h, draw) => {
                            if (!this.textures.exists(key)) {
                                const cv = this.textures.createCanvas(key, w, h);
                                if (cv) {
                                    const ctx = cv.getContext();
                                    draw(ctx, w, h);
                                    cv.refresh();
                                }
                            }
                        };

                        createTex('glow', 128, 128, (ctx, w, h) => {
                            const grd = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
                            grd.addColorStop(0, 'rgba(255,255,255,1)');
                            grd.addColorStop(0.35, 'rgba(255,255,255,0.55)');
                            grd.addColorStop(1, 'rgba(255,255,255,0)');
                            ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
                        });

                        createTex('spark', 12, 12, (ctx, w, h) => {
                            ctx.fillStyle = '#ffffff';
                            ctx.beginPath();
                            ctx.moveTo(6, 0); ctx.lineTo(8, 4); ctx.lineTo(12, 6); ctx.lineTo(8, 8);
                            ctx.lineTo(6, 12); ctx.lineTo(4, 8); ctx.lineTo(0, 6); ctx.lineTo(4, 4);
                            ctx.closePath(); ctx.fill();
                        });

                        createTex('vgrad', 8, 256, (ctx, w, h) => {
                            const grd = ctx.createLinearGradient(0, 0, 0, h);
                            grd.addColorStop(0, 'rgba(0,0,0,0)');
                            grd.addColorStop(1, 'rgba(0,0,0,1)');
                            ctx.fillStyle = grd; ctx.fillRect(0, 0, w, h);
                        });
                    }
                }

                        const m = MINERS[i];
                        if (S.unlocked[i]) {
                            const cost = minerCost(i, S.minerLevel[i]);
                            if (S.coins < cost) { toast(this, 'Not enough coins', C.red); return; }
                            S.coins -= cost; S.minerLevel[i]++; save(); sfx('confirm', 1.1);
                            toast(this, `${m.name} \u2192 Lv ${S.minerLevel[i]}`, m.tint);
                            this.refreshAll(); return;
                        }
                        const need = m.adsRequired;
                        if (S.adProgress[i] >= need) {
                            if (S.coins < m.baseCost) { toast(this, 'Not enough coins', C.red); return; }
                            S.coins -= m.baseCost; this.doUnlock(i); return;

                    }

                    /* ---- EDIT DETAILS DIALOG MODAL (WITH DIRECT HTML INPUT FOR MOBILE KEYBOARD) ---- */
                    showEditDetailsModal(method) {
                        if (this.activeEditModal) return;
                        this.data.set('modal', true);

                        const layer = this.add.container(0, 0).setDepth(8000);
                        this.activeEditModal = layer;

                        const shade = this.add.rectangle(DW / 2, DH / 2, DW, DH, 0x040812, 0.88).setInteractive();
                        layer.add(shade);

                        const mw = 640, mh = method.keypadType === 'numeric' ? 700 : 620;
                        const my = DH / 2;
                        const panel = this.add.container(DW / 2, my);
                        layer.add(panel);

                        // Modal Background Graphics
                        const g = this.add.graphics();
                        rr(g, -mw / 2, -mh / 2, mw, mh, 28, 0x0f172a, 1);
                        rrs(g, -mw / 2, -mh / 2, mw, mh, 28, method.headerColor, 3, 0.9);
                        
                        rr(g, -mw / 2, -mh / 2, mw, 70, 28, method.headerColor, 1);
                        g.fillStyle(method.headerColor, 1);
                        g.fillRect(-mw / 2, -mh / 2 + 40, mw, 30);
                        panel.add(g);

                        const headerTitle = this.add.text(0, -mh / 2 + 35, `${method.name.toUpperCase()} DETAILS`, {
                            fontFamily: FONT, fontSize: '28px', color: '#ffffff'
                        }).setOrigin(0.5);
                        panel.add(headerTitle);

                        const hintTxt = this.add.text(0, -mh / 2 + 96, method.hint, t(16, TXT.dim)).setOrigin(0.5);
                        panel.add(hintTxt);

                        let currentVal = S.account[method.id] || '';

                        const inputBg = this.add.graphics();
                        panel.add(inputBg);

                        const valTxt = this.add.text(0, -mh / 2 + 150, currentVal || method.placeholder, t(22, currentVal ? '#ffffff' : '#4b5563')).setOrigin(0.5);
                        panel.add(valTxt);

                        const updateInputDisplay = () => {
                            valTxt.setText(currentVal || method.placeholder);
                            valTxt.setColor(currentVal ? '#60a5fa' : '#4b5563');

                            inputBg.clear();
                            rr(inputBg, -mw / 2 + 30, -mh / 2 + 120, mw - 60, 60, 14, 0x080e1a, 1);
                            rrs(inputBg, -mw / 2 + 30, -mh / 2 + 120, mw - 60, 60, 14, currentVal ? method.headerColor : C.stroke, 2, 1);
                        };
                        updateInputDisplay();

                        // -------------------------------------------------------------
                        // REAL OVERLAY HTML INPUT ELEMENT FOR RELIABLE SOFT KEYBOARD FOCUS
                        // -------------------------------------------------------------
                        const canvasBounds = this.sys.game.canvas.getBoundingClientRect();
                        const scaleX = canvasBounds.width / DW;
                        const scaleY = canvasBounds.height / DH;

                        const inputW = Math.round((mw - 80) * scaleX);
                        const inputH = Math.round(58 * scaleY);
                        const inputX = Math.round(canvasBounds.left + (DW / 2 - (mw - 80) / 2) * scaleX);
                        const inputY = Math.round(canvasBounds.top + (my - mh / 2 + 120) * scaleY);

                        const htmlInput = document.createElement('input');
                        htmlInput.type = method.keypadType === 'numeric' ? 'tel' : 'text';
                        htmlInput.value = currentVal;
                        htmlInput.placeholder = method.placeholder;
                        htmlInput.style.position = 'fixed';
                        htmlInput.style.left = inputX + 'px';
                        htmlInput.style.top = inputY + 'px';
                        htmlInput.style.width = inputW + 'px';
                        htmlInput.style.height = inputH + 'px';
                        htmlInput.style.zIndex = '99999';
                        htmlInput.style.backgroundColor = '#080e1a';
                        htmlInput.style.color = '#60a5fa';
                        htmlInput.style.border = '2px solid ' + (method.headerColor ? hex(method.headerColor) : '#33456b');
                        htmlInput.style.borderRadius = '12px';
                        htmlInput.style.padding = '0 12px';
                        htmlInput.style.fontSize = Math.round(18 * scaleY) + 'px';
                        htmlInput.style.textAlign = 'center';
                        htmlInput.style.fontFamily = 'system-ui, sans-serif';
                        htmlInput.style.outline = 'none';
                        htmlInput.style.boxSizing = 'border-box';

                        document.body.appendChild(htmlInput);

                        // Auto Focus Input Box to pop up mobile keyboard
                        setTimeout(() => {
                            try { htmlInput.focus(); } catch(e) {}
                        }, 100);

                        htmlInput.addEventListener('input', (e) => {
                            currentVal = e.target.value;
                            updateInputDisplay();
                        });

                        htmlInput.addEventListener('keyup', (e) => {
                            currentVal = e.target.value;
                            updateInputDisplay();
                        });

                        let keypadStartY = -mh / 2 + 220;

                        if (method.keypadType === 'numeric') {
                            const keys = [
                                ['1', '2', '3'],
                                ['4', '5', '6'],
                                ['7', '8', '9'],
                                ['CLR', '0', '\u232b']
                            ];
                            const kw = 175, kh = 58, gapX = 14, gapY = 10;
                            keys.forEach((row, ri) => {
                                row.forEach((k, ci) => {
                                    const kx = -((kw * 3 + gapX * 2) / 2) + ci * (kw + gapX) + kw / 2;
                                    const ky = keypadStartY + ri * (kh + gapY) + kh / 2;
                                    const btn = new Btn(this, kx, ky, {
                                        w: kw, h: kh, label: k, color: k === 'CLR' || k === '\u232b' ? 0x22304d : 0x16233d,
                                        fontSize: 22, radius: 14,
                                        onClick: () => {
                                            if (k === 'CLR') currentVal = '';
                                            else if (k === '\u232b') currentVal = currentVal.slice(0, -1);
                                            else if (currentVal.length < 24) currentVal += k;
                                            htmlInput.value = currentVal;
                                            updateInputDisplay();
                                        }
                                    });
                                    panel.add(btn);
                                });
                            });
                            keypadStartY += 4 * (kh + gapY) + 10;
                        } else {
                            const syms = ['@', '.', '_', '-', 'CLR', '\u232b'];
                            const sw = 84, sh = 52, sGap = 10;
                            syms.forEach((k, ci) => {
                                const kx = -((sw * 6 + sGap * 5) / 2) + ci * (sw + sGap) + sw / 2;
                                const btn = new Btn(this, kx, keypadStartY + sh / 2, {
                                    w: sw, h: sh, label: k, color: k === 'CLR' || k === '\u232b' ? 0x22304d : 0x1c2b47,
                                    fontSize: 20, radius: 12,
                                    onClick: () => {
                                        if (k === 'CLR') currentVal = '';
                                        else if (k === '\u232b') currentVal = currentVal.slice(0, -1);
                                        else if (currentVal.length < 34) currentVal += k;
                                        htmlInput.value = currentVal;
                                        updateInputDisplay();
                                    }
                                });
                                panel.add(btn);
                            });

                            keypadStartY += sh + 14;
                            if (method.presets && method.presets.length > 0) {
                                const pw = Math.floor((mw - 80 - (method.presets.length - 1) * 12) / method.presets.length);
                                method.presets.forEach((p, pi) => {
                                    const px = -((pw * method.presets.length + 12 * (method.presets.length - 1)) / 2) + pi * (pw + 12) + pw / 2;
                                    const pbtn = new Btn(this, px, keypadStartY + 24, {
                                        w: pw, h: 50, label: p, color: 0x1d3557, fontSize: 16, radius: 14,
                                        onClick: () => {
                                            if (!currentVal.includes('@') && p.startsWith('@')) {
                                                currentVal += p;
                                            } else if (!currentVal.includes(p)) {
                                                currentVal += (currentVal.length > 0 && !currentVal.endsWith('@') && !p.startsWith('@') ? '@' : '') + p;
                                            }
                                            htmlInput.value = currentVal;
                                            updateInputDisplay();
                                        }
                                    });
                                    panel.add(pbtn);
                                });
                                keypadStartY += 56;
                            }
                        }

                        const closeModal = () => {
                            if (htmlInput && htmlInput.parentNode) {
                                htmlInput.parentNode.removeChild(htmlInput);
                            }
                            this.data.set('modal', false);
                            this.activeEditModal = null;
                            layer.destroy();
                            this.refreshAll();
                        };

                        const saveAction = () => {
                            const val = currentVal.trim();
                            if (!val) {
                                toast(this, 'Please enter valid details', C.red);
                                return;
                            }
                            S.account[method.id] = val;
                            save();
                            sfx('confirm');
                            toast(this, `${method.name} details saved!`, C.green);
                            closeModal();
                        };

                        // SAVE DETAILS BUTTON
                        const saveBtn = new Btn(this, 0, mh / 2 - 70, {
                            w: mw - 60, h: 64, label: 'SAVE DETAILS', color: C.green, shadow: C.greenDk, fontSize: 26, radius: 20,
                            onClick: saveAction
                        });
                        panel.add(saveBtn);

                        // CANCEL BUTTON
                        const cancelTxt = this.add.text(0, mh / 2 - 20, 'Cancel', t(18, TXT.dim)).setOrigin(0.5).setInteractive({ useHandCursor: true });
                        cancelTxt.on('pointerup', () => { sfx('click'); closeModal(); });
                        panel.add(cancelTxt);
                    }

                    refreshAll() {
                        this.redraws.forEach((r) => r());
                    }
                }

                        list.add(titleText);

                        // Dynamic Referral Rewards read from Live Admin Config
                        const refGold = adminConfig().referralGoldReward || 600;
                        const refCoins = adminConfig().referralCoinsReward || 340000;
                        const refGems = adminConfig().referralGemsReward || 1004;

                        const rewardSub = this.add.text(DW / 2, y + 68, `Per Invited Friend Reward:\n+${comma(refGold)} GOLD  \u00b7  +${fmt(refCoins)} COINS  \u00b7  +${comma(refGems)} \ud83d\udc8e GEMS`, {
                            fontFamily: FONT, fontSize: '18px', color: '#7bf0ae', align: 'center', lineSpacing: 4
                        }).setOrigin(0.5);
                        list.add(rewardSub);

                        // Stats Summary Box inside Card
                        const statBoxG = this.add.graphics();
                        rr(statBoxG, 40, y + 110, DW - 80, 100, 18, 0x0a111e, 0.95);
                        rrs(statBoxG, 40, y + 110, DW - 80, 100, 18, C.stroke, 2, 0.7);
                        list.add(statBoxG);

                        const invitedTxt = this.add.text(DW / 2, y + 135, `INVITED FRIENDS: ${S.referralCount || 0}`, t(20, '#ffffff')).setOrigin(0.5);
                        const earnedTxt = this.add.text(DW / 2, y + 180, `TOTAL REWARD: ${comma(S.referralGoldEarned || 0)} GOLD · ${fmt(S.referralCoinsEarned || 0)} COINS · ${comma(S.referralGemsEarned || 0)} GEMS`, t(14, TXT.gold)).setOrigin(0.5);
                        list.add([invitedTxt, earnedTxt]);

                        // Telegram Share Link
                        const shareUrl = `${TELEGRAM_SHARE_BASE}?startapp=REF_${displayUid}`;
                        const shareMsgText = `ℝ𝕖𝕒𝕔𝕙 𝟙𝟙,𝟘𝟘𝟘 𝔾𝕠𝕝𝕕 & 𝕀𝕟𝕤𝕥𝕒𝕟𝕥 ℂ𝕒𝕤𝕙𝕠𝕦𝕥!\n🚀 𝕊𝕥𝕒𝕣𝕥 𝕪𝕠𝕦𝕣 𝕞𝕚𝕟𝕚𝕟𝕘 ${TELEGRAM_BOT_URL}?startapp=REF_${displayUid}`;

                        // Share / Invite Button
                        const inviteBtn = new Btn(this, DW / 2 - 130, y + 250, {
                            w: 230, h: 70, label: '\ud83d\udce4 SHARE LINK', color: C.green, shadow: C.greenDk, fontSize: 20, radius: 18,
                            onClick: () => {
                                sfx('confirm');
                                const tgUrl = `https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareMsgText)}`;
                                try {
                                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                                        window.Telegram.WebApp.openTelegramLink(tgUrl);
                                    } else {
                                        window.open(tgUrl, '_blank');
                                    }
                                } catch (e) {
                                    window.open(tgUrl, '_blank');
                                }
                                toast(this, 'SHARE LINK OPENED!', C.green);
                            }
                        });
                        list.add(inviteBtn);

                        // Copy Link Button
                        const copyLinkBtn = new Btn(this, DW / 2 + 130, y + 250, {
                            w: 230, h: 70, label: '\ud83d\udccb COPY LINK', color: C.purple, shadow: C.purpleDk, fontSize: 20, radius: 18,
                            onClick: () => {
                                sfx('click');
                                copyToClipboard(shareMsgText);
                                toast(this, 'INVITE LINK COPIED!', C.gold);
                            }
                        });
                        list.add(copyLinkBtn);

                        // Sync / Claim Referral Rewards Button (Dynamic Calculation from Live Admin Config)
                        const claimRefBtn = new Btn(this, DW / 2, y + 325, {
                            w: DW - 80, h: 60, label: '🔄 SYNC & CLAIM REFERRAL REWARDS', color: C.blue, shadow: C.blueDk, fontSize: 18, radius: 16,
                            onClick: () => {
                                sfx('click');
                                if (db && currentUser) {
                                    toast(this, 'Syncing referrals...', C.gold);
                                    db.collection('referrals').where('referrer', '==', displayUid).where('claimed', '==', false).get().then(snapshot => {
                                        if (snapshot.empty) {
                                            toast(this, 'No new referrals found yet.', C.gold);
                                            return;
                                        }
                                        let count = 0;
                                        const batch = db.batch();
                                        snapshot.forEach(doc => {
                                            count++;
                                            batch.update(doc.ref, { claimed: true });
                                        });

                                        // Read dynamic live amounts set by admin
                                        const curRefGold = adminConfig().referralGoldReward || 600;
                                        const curRefCoins = adminConfig().referralCoinsReward || 340000;
                                        const curRefGems = adminConfig().referralGemsReward || 1004;

                                        const addGold = count * curRefGold;
                                        const addCoins = count * curRefCoins;
                                        const addGems = count * curRefGems;

                                        S.cash += addGold;
                                        S.coins += addCoins;
                                        S.totalCoins += addCoins;
                                        S.gems += addGems;

                                        S.referralCount = (S.referralCount || 0) + count;
                                        S.referralGoldEarned = (S.referralGoldEarned || 0) + addGold;
                                        S.referralCoinsEarned = (S.referralCoinsEarned || 0) + addCoins;
                                        S.referralGemsEarned = (S.referralGemsEarned || 0) + addGems;

                                        batch.commit();
                                        save();
                                        sfx('coin', 1.3);

                                        invitedTxt.setText(`INVITED FRIENDS: ${S.referralCount}`);
                                        earnedTxt.setText(`TOTAL REWARD: ${comma(S.referralGoldEarned)} GOLD · ${fmt(S.referralCoinsEarned)} COINS · ${comma(S.referralGemsEarned)} GEMS`);
                                        toast(this, `Claimed for ${count} friend(s): +${comma(addGold)} GOLD, +${fmt(addCoins)} COINS, +${comma(addGems)} GEMS!`, C.green);
                                    }).catch(err => {
                                        toast(this, 'Sync complete.', C.gold);
                                    });
                                } else {
                                    toast(this, 'Invite friends to earn rewards!', C.gold);
                                }
                            }
                        });
                        list.add(claimRefBtn);

                        y += refCardH + 30;
                        attachScroll(this, list, 0, vy, DW, vh, y + 40);
                    }
                }

                /* ==== src/main.ts ================================================= */
                setMuted(S.muted);
                applyAdminConfig(adminConfig());

                const game = new Phaser.Game({
                    type: Phaser.AUTO,
                    parent: 'game',
                    backgroundColor: '#05070d',
                    width: DW, height: DH,
                    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
                    render: { antialias: true, powerPreference: 'high-performance' },
                    scene: [Boot, Title, Game, AdScene, MinersPanel, UpgradePanel, RewardsPanel, CashPanel, SettingsPanel],
                });

                document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
                window.addEventListener('pagehide', () => save());
            })();
        });
    </script>
</body>
</html>
